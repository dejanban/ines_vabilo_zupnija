name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  test:
    name: Check application and PDF export
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      deploy_with_actions: ${{ steps.pages.outputs.deploy_with_actions }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install PDF validation tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Check JavaScript syntax
        run: |
          node --check spletna-aplikacija/dist/app.mjs
          node --check spletna-aplikacija/dist/certificate.mjs
          node --check spletna-aplikacija/dist/pdf.mjs
      - name: Check recipient handling and PDF export
        run: node --test spletna-aplikacija/tests/core.mjs
      - name: Check Pages publishing mode
        id: pages
        env:
          PAGES_API_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          endpoint = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/pages"
          request = urllib.request.Request(endpoint, headers={
              'Accept': 'application/vnd.github+json',
              'Authorization': f"Bearer {os.environ['PAGES_API_TOKEN']}",
              'X-GitHub-Api-Version': '2022-11-28',
          })
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  pages = json.load(response)
              deploy = pages.get('build_type') == 'workflow'
              print(f"Pages publishing mode: {pages.get('build_type', 'branch')}")
          except urllib.error.HTTPError as error:
              if error.code not in (403, 404):
                  raise
              deploy = False
              print('::notice::Pages Actions publishing is unavailable. The repository root includes an entry point for branch publishing.')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"deploy_with_actions={str(deploy).lower()}\n")
          PY

  deploy:
    name: Publish application
    needs: test
    if: needs.test.outputs.deploy_with_actions == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static application
        uses: actions/upload-pages-artifact@v4
        with:
          path: spletna-aplikacija/dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

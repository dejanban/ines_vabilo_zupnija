name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  test:
    name: Check application and PDF export
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install PDF validation tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Check JavaScript syntax
        run: |
          node --check spletna-aplikacija/dist/app.mjs
          node --check spletna-aplikacija/dist/certificate.mjs
          node --check spletna-aplikacija/dist/pdf.mjs
      - name: Check recipient handling and PDF export
        run: node --test spletna-aplikacija/tests/core.mjs

  deploy:
    name: Publish application
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static application
        uses: actions/upload-pages-artifact@v4
        with:
          path: spletna-aplikacija/dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
